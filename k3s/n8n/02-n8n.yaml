apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: n8n
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
# NodePort so the editor UI is reachable from outside the cluster (the Docker
# Compose version in ./compose.yml doesn't publish a port at all - only
# reachable over the `autoship` Docker network there). Run
# `kubectl get svc -n n8n n8n` to see the assigned NodePort.
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: n8n
spec:
  type: NodePort
  selector:
    app: n8n
  ports:
    - port: 5678
      targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
        - name: n8n
          image: n8nio/n8n:2.33.4
          env:
            # Same as ./compose.yml - n8n calls out to Ollama for LLM nodes.
            - name: OLLAMA_API_URL
              value: "http://10.21.213.16:11434"
            - name: OLLAMA_DEFAULT_MODEL
              value: "qwen3-coder:30b"
            - name: N8N_SECURE_COOKIE
              value: "false"
          ports:
            - containerPort: 5678
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
